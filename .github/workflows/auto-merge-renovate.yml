name: Auto Approve and Merge Renovate PRs

# Thin caller of decaf-ts/reusable-actions/.github/workflows/auto-merge-renovate.yml.
# Approves and enables auto-merge on bot dependency PRs once every status check
# passes, so trivy/renovate dependency updates release without human interaction.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [master]

jobs:
  auto-approve-merge:
    if: |
      github.actor == 'renovate[bot]' ||\n      github.actor == 'dependabot[bot]' ||\n      github.actor == 'ptspswn'
    uses: decaf-ts/reusable-actions/.github/workflows/auto-merge-renovate.yml@master
    secrets: inherit
