name: decaf-postgres-integration

services:
  postgres:
    image: postgres:16
    container_name: decaf-postgres-integration
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: decaf
      POSTGRES_PASSWORD: decaf-integration
      POSTGRES_DB: decaf_integration
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decaf -d decaf_integration"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - decaf-postgres-integration-data:/var/lib/postgresql/data

volumes:
  decaf-postgres-integration-data:
