name: decaf-erpnext-integration

# Standalone live ERPNext stack for the ERPNext adapter integration tests.
#
# Sandbox only: every credential below is a local throwaway default and can be
# overridden through the environment. Do not point this stack at a real
# provider or production instance.
#
#   ERPNEXT_ADMIN_PASSWORD   Administrator password for the site (default: admin123)
#   ERPNEXT_DB_ROOT_PASSWORD MariaDB root password (default: erpnext-db-root)
#   ERPNEXT_SITE_NAME        Frappe site name (default: frontend)
#   ERPNEXT_VERSION          frappe/erpnext image tag (default: v15)
#
# Boot:  docker compose -p decaf-erpnext-integration -f docker/erpnext-compose.yml up -d --wait
# Down:  docker compose -p decaf-erpnext-integration -f docker/erpnext-compose.yml down -v

x-erpnext-image: &erpnext-image
  image: ${ERPNEXT_IMAGE:-frappe/erpnext}:${ERPNEXT_VERSION:-v15}
  platform: linux/amd64
  restart: unless-stopped
  labels:
    decaf.company: with-ai
    decaf.project: decaf-ts
    decaf.issue: SAA-1672
    decaf.run: a15a3615-8d46-4877-8d08-5190df9290cb
    decaf.purpose: it

x-erpnext-backend: &erpnext-backend
  <<: *erpnext-image
  volumes:
    - decaf-erpnext-sites:/home/frappe/frappe-bench/sites
    - decaf-erpnext-logs:/home/frappe/frappe-bench/logs

services:
  # MariaDB is the only database supported by ERPNext.
  db:
    image: mariadb:10.6
    container_name: decaf-erpnext-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD:-erpnext-db-root}
      MARIADB_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD:-erpnext-db-root}
    volumes:
      - decaf-erpnext-db-data:/var/lib/mysql
    labels:
      decaf.company: with-ai
      decaf.project: decaf-ts
      decaf.issue: SAA-1672
      decaf.run: a15a3615-8d46-4877-8d08-5190df9290cb
      decaf.purpose: it
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  redis-cache:
    image: redis:6.2-alpine
    container_name: decaf-erpnext-redis-cache
    restart: unless-stopped
    labels:
      decaf.company: with-ai
      decaf.project: decaf-ts
      decaf.issue: SAA-1672
      decaf.run: a15a3615-8d46-4877-8d08-5190df9290cb
      decaf.purpose: it
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis-queue:
    image: redis:6.2-alpine
    container_name: decaf-erpnext-redis-queue
    restart: unless-stopped
    volumes:
      - decaf-erpnext-redis-queue-data:/data
    labels:
      decaf.company: with-ai
      decaf.project: decaf-ts
      decaf.issue: SAA-1672
      decaf.run: a15a3615-8d46-4877-8d08-5190df9290cb
      decaf.purpose: it
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # One-shot: writes the shared site config (db/redis/socketio) into the sites volume.
  configurator:
    <<: *erpnext-backend
    container_name: decaf-erpnext-configurator
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  # One-shot: creates the site and installs the erpnext app (bench setup step).
  create-site:
    <<: *erpnext-backend
    container_name: decaf-erpnext-create-site
    restart: "no"
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] &&
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] &&
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json";
          sleep 5;
        done;
        echo "sites/common_site_config.json found";
        if [ -d "sites/$$SITE_NAME" ]; then
          echo "Site $$SITE_NAME already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password="$$ADMIN_PASSWORD" --db-root-username=root --db-root-password="$$DB_ROOT_PASSWORD" --install-app erpnext --set-default "$$SITE_NAME";
        fi;
    environment:
      SITE_NAME: ${ERPNEXT_SITE_NAME:-frontend}
      ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD:-admin123}
      DB_ROOT_PASSWORD: ${ERPNEXT_DB_ROOT_PASSWORD:-erpnext-db-root}
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  backend:
    <<: *erpnext-backend
    container_name: decaf-erpnext-backend
    environment:
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    depends_on:
      create-site:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  websocket:
    <<: *erpnext-backend
    container_name: decaf-erpnext-websocket
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully
      create-site:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Public HTTP entrypoint (REST API + UI).
  frontend:
    <<: *erpnext-image
    container_name: decaf-erpnext-frontend
    platform: linux/amd64
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      NGINX_LISTEN_PORT: "8080"
      FRAPPE_SITE_NAME_HEADER: ${ERPNEXT_SITE_NAME:-frontend}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - decaf-erpnext-sites:/home/frappe/frappe-bench/sites
      - decaf-erpnext-logs:/home/frappe/frappe-bench/logs
    ports:
      - "8181:8080"
    depends_on:
      create-site:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      websocket:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/method/ping >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  queue-short:
    <<: *erpnext-backend
    container_name: decaf-erpnext-queue-short
    command:
      - bench
      - worker
      - --queue
      - short,default
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      create-site:
        condition: service_completed_successfully

  queue-long:
    <<: *erpnext-backend
    container_name: decaf-erpnext-queue-long
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      create-site:
        condition: service_completed_successfully

  scheduler:
    <<: *erpnext-backend
    container_name: decaf-erpnext-scheduler
    command:
      - bench
      - schedule
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      create-site:
        condition: service_completed_successfully

volumes:
  decaf-erpnext-db-data:
    name: decaf-erpnext-db-data
    labels:
      decaf.company: with-ai
      decaf.project: decaf-ts
      decaf.issue: SAA-1672
      decaf.run: a15a3615-8d46-4877-8d08-5190df9290cb
      decaf.purpose: it
  decaf-erpnext-redis-queue-data:
    name: decaf-erpnext-redis-queue-data
    labels:
      decaf.company: with-ai
      decaf.project: decaf-ts
      decaf.issue: SAA-1672
      decaf.run: a15a3615-8d46-4877-8d08-5190df9290cb
      decaf.purpose: it
  decaf-erpnext-sites:
    name: decaf-erpnext-sites
    labels:
      decaf.company: with-ai
      decaf.project: decaf-ts
      decaf.issue: SAA-1672
      decaf.run: a15a3615-8d46-4877-8d08-5190df9290cb
      decaf.purpose: it
  decaf-erpnext-logs:
    name: decaf-erpnext-logs
    labels:
      decaf.company: with-ai
      decaf.project: decaf-ts
      decaf.issue: SAA-1672
      decaf.run: a15a3615-8d46-4877-8d08-5190df9290cb
      decaf.purpose: it
