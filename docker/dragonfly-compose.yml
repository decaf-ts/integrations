name: decaf-redis-integration

services:
  # DragonflyDB - Redis-compatible in-memory datastore used by the Redis adapter tests
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: decaf-redis-integration
    restart: unless-stopped
    command: ["--logtostderr"]
    ports:
      - "6379:6379"
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6379'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
