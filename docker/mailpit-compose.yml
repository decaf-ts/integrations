name: decaf-smtp-integration

services:
  # Mailpit - SMTP sink used by the Email service integration tests.
  # SMTP on 1025, HTTP API/UI on 8025; accepts any AUTH and plaintext AUTH so
  # the credential path can be exercised locally.
  mailpit:
    image: axllent/mailpit:latest
    container_name: decaf-smtp-integration
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"
